sources:
  nginx_logs:
    type: docker_logs
    include_labels:
      # Scoped to one environment, not a bare `true`. This source reads the Docker socket, so it
      # sees every container on the host — including the other environment's proxies when
      # development and production share a machine. A shared label meant production's Vector
      # ingested development's access logs and billed them to production, into a SummingMergeTree
      # partition no later correction can take back.
      - "vector.enable=${VECTOR_SCOPE}"

transforms:
  parse_base:
    type: remap
    inputs:
      - nginx_logs
    source: |
      parsed, err = parse_key_value(.message)

      if err != null { abort }
      if !exists(parsed.ip) || !exists(parsed.bytes) { abort }

      .ip = parsed.ip
      .bytes = to_int(parsed.bytes) ?? 0
      .video = parsed.video
      .tid = parsed.tid

      if .bytes <= 0 { abort }

      del(.message)

  prep_bandwidth_logs:
    type: remap
    inputs:
      - parse_base
    source: |
      video = string!(.video)
      if video == "" || video == "-" || video == "<null>" { abort }

      ip = string!(.ip)
      bytes = .bytes

      # The day the traffic happened, taken from the log line's own timestamp. The batch below is
      # flushed on a timer, so a batch that straddles midnight would otherwise be stamped at
      # insert time and book the tail of one day to the next — permanently, since `date` is the
      # partition key of a SummingMergeTree no later correction can take back.
      #
      # Not `.timestamp ?? now()`: reading a path never errors in VRL, it yields null, so the
      # coalescing has nothing to catch and the config is rejected outright (E651). The missing
      # timestamp has to be handled as the null it actually is.
      ts = .timestamp
      if !is_timestamp(ts) { ts = now() }
      date = format_timestamp!(ts, "%Y-%m-%d")

      # Absent on every playback line and on downloads that carried no id; nginx logs it as an
      # empty value either way, so the column's own default is what lands.
      tid = to_string(.tid) ?? ""

      . = {}
      .video_ulid = video
      .ip = ip
      .bytes = bytes
      .date = date
      .tid = tid

  aggregate_bandwidth_logs:
    type: reduce
    inputs:
      - prep_bandwidth_logs
    # `date` is part of the key, not just carried along: summing across a midnight boundary would
    # collapse two days of traffic onto whichever one the reduce happened to see first.
    group_by:
      - video_ulid
      - ip
      - date
      # Grouped on, not carried: summing across tracking ids would merge two customers' traffic
      # into one row and lose exactly what the id was added for.
      - tid
    merge_strategies:
      bytes: sum

sinks:
  stdout:
    type: console
    inputs:
      - aggregate_bandwidth_logs
    encoding:
      codec: json
  laravel_bandwidth:
    type: http
    inputs:
      - aggregate_bandwidth_logs
    uri: "${INTERNAL_API_URL}/bandwidth"
    method: post
    encoding:
      codec: json
    request:
      headers:
        Authorization: "Bearer ${INTERNAL_API_SECRET}"
    batch:
      # Collapse many aggregated events into one POST (and therefore one queue
      # job) so the per-request/per-job overhead is amortised across the batch.
      max_events: 1000
      timeout_secs: 5
