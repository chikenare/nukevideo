name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs skipped via `if:` still satisfy branch-protection required checks, unlike
# workflow-level `paths:` filters, which leave them pending forever.
jobs:
  changes:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # "every": a file counts only when it matches ALL patterns of a filter,
          # which turns the negated backend list into an exclusion (backend lives
          # at the repo root, so it is "anything that is not front/ or docs/").
          predicate-quantifier: every
          filters: |
            backend:
              - '!front/**'
              - '!docs/**'
            frontend:
              - '{front/**,.github/workflows/ci.yml}'

  backend:
    runs-on: ubuntu-latest

    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # SourceBitRateTest muxes real fixtures: what ffprobe reports per container IS the
      # regression under test, so faking the processes would test nothing.
      - name: Install media tools
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg mkvtoolnix

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Tests
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest

    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint .

      - name: Type check
        run: pnpm run type-check
